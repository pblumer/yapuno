name: Go CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf "Unformatted Go files:\\n%s\\n" "$unformatted"
            exit 1
          fi
      - name: Browser pairing JavaScript syntax
        run: |
          node --check internal/pairingweb/pair.js
          node --check internal/pairingweb/scan.js
          node --check internal/pairingweb/scan-utils.js
          node --check internal/familyweb/qr-render.js
          node --check internal/familyweb/qrcode.vendor.js
      - name: QR scanner and offline generator tests
        run: node --test internal/pairingweb/scan_utils.test.cjs internal/familyweb/qr_render.test.cjs
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
